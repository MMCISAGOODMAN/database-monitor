<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>database-monitor v2.0 封面</title>
</head>
<body style="margin:0;padding:40px;background:#111827;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <!-- 截图目标：900×383 -->
  <div id="cover" style="width:900px;height:383px;position:relative;overflow:hidden;border-radius:4px;background:linear-gradient(135deg,#070b14 0%,#0f1c32 45%,#0a1628 100%);box-shadow:0 20px 60px rgba(0,0,0,0.45);">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(0,212,255,0.18) 0%,transparent 50%),radial-gradient(ellipse at 85% 70%,rgba(0,122,153,0.22) 0%,transparent 45%);"></div>
    <div style="position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,#00d4ff,#007a99);"></div>
    <div style="position:relative;z-index:1;height:100%;padding:36px 48px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <span style="font-size:14px;letter-spacing:2px;color:#8e9aaf;text-transform:uppercase;">database-monitor</span>
        <span style="display:inline-block;padding:2px 10px;border-radius:4px;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.45);color:#00d4ff;font-size:13px;font-weight:700;">v2.0</span>
      </div>
      <h1 style="margin:0 0 14px 0;font-size:34px;line-height:1.35;font-weight:700;color:#f5f7fa;max-width:720px;">
        顾问会说话了，指标也不再唬人
      </h1>
      <p style="margin:0;font-size:16px;color:#8e9aaf;letter-spacing:1px;">
        分库顾问 · 真实速率 · 大屏监控 · 开源免费
      </p>
    </div>
  </div>
</body>
</html>
